# The local models. Each was served by vLLM 0.27.1 in NVIDIA's container nvcr.io/nvidia/vllm:26.08-py3 on one NVIDIA DGX Spark, with the `serve` command given here, and reached at `url` through vLLM's OpenAI-compatible interface.
# kind: "chat" models are asked through the chat interface (score.py, chat_servers); "base" models are read from prompt log-probabilities (score.py, base_servers).
# Change `url` to wherever the model is served.

[models.qwen27]
